# A drop-in, because the app's own unit is written once by bootstrap.sh and
# never redeployed — this file comes with every deploy.
#
# `kill -USR2 <pid>` makes Node write a diagnostic report (JS stack, libuv
# handles, heap and resource usage) into the directory below, without
# stopping the process. The watchdog does this before it restarts a hung
# app, so a restart no longer destroys the only evidence: on 29.09.2026 the
# process hung for hours at 0 % CPU with no open upstream connection, and the
# restart that fixed it left nothing to read (TODO.md § 5d).
#
# StateDirectory appends to the main unit's list; systemd creates the
# subdirectory and hands it to the service user.
[Service]
StateDirectory=begutachtungs-monitor/reports
Environment="NODE_OPTIONS=--report-on-signal --report-signal=SIGUSR2 --report-directory=/var/lib/begutachtungs-monitor/reports"
