# The memory ceiling, as a drop-in because the main unit is written once by
# bootstrap.sh and never redeployed; this file comes with every deploy and
# overrides the unit's MemoryMax=.
#
# 704M since 14.11.2026, from 512M. Under 512M the box thrashed on its own
# code: anon sat at ~390 MB (the 320 MB V8 heap plus the rest), which left
# ~45 MB of page cache for the Node binary, V8 and the shared libraries. The
# kernel evicted those pages and read them back without end — 137,7 GB read
# from disk in 31,8 hours (read_bytes) while the app itself read 0,79 GB
# (rchar), and workingset_refault_file stood at 33,6 million pages, the same
# 137 GB. A main thread that faults on an evicted code page waits for the
# disk: that is the hang the watchdog kept catching (06.11., 08.11.: every
# route 000, empty JS stack, 2,8 % CPU, the diagnostic report written over a
# minute late), and memory.pressure counted 43 s of full stall since the
# last restart. memory.events `max` stood at 620.087, `oom` at 0 — reclaim
# always succeeded, it just made everything wait.
#
# 704M = anon ~390 MB + ~150 MB for code and file pages + headroom; the box
# has 952 MB, and everything outside this unit used ~100 MB that day.
# Check after a change: workingset_refault_file and read_bytes
# (/proc/<pid>/io) should rise slowly, memory.pressure "full" stay near 0.
[Service]
MemoryMax=704M
