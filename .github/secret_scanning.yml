# Secret scanning skips the test fixtures: they are pages and documents
# captured verbatim from the upstream sources (Parliament, RIS, the Länder,
# the EU), and a key found there belongs to the publisher, served to every
# visitor of its site — Kärnten's pages carry a Google Maps key in a
# commented-out script tag, for example. Editing a capture would make it
# stop being one. Our own credentials never live in the repository at all.
paths-ignore:
  - "tests/fixtures/**"
