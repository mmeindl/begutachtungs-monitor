# Weekly drift alarm for the Textgegenüberstellung (docs/architecture.md
# §12.13).
#
# What it does: once a week it measures both annex paths over the 400 most
# recent Begut records, applies class A and class B from
# `scripts/lib/annexReport.ts` — which is where both are defined and why —
# and opens one GitHub issue when something stands, closing it again on the
# first clean run.
#
# What is NOT checked here: whether we broke the engine. `ci.yml` with 1.000+
# tests catches that, as do `tests/annexGolden.test.ts`, which freezes two
# real annexes with their numbers, and, since 22.09.2026,
# `tests/annexGateGolden.test.ts`, which freezes five real gate runs with
# their verdicts — two of those failed, measured, on the engine work of 19.09.
# that was worth twelve findings here. What is checked is the other
# direction: a ressort typesets its annex differently than before and the
# page silently shows a Gegenüberstellung nobody recognises as wrong. That is
# the operational load the predecessor died of, so the alarm runs on GitHub's
# runners and not as a service on the 1 GB VPS.
#
# **When the alarm fires because you improved the engine on purpose:** class A
# cannot do that — there is no baseline there. Class B can, and then the rule
# holds without exception: the baseline is pulled up in the SAME commit as the
# change —
# `npx vite-node scripts/ci/annexDrift.ts -- --grundlinie-schreiben=tests/fixtures/annex-baseline.json annex-xml.json annex-pdf.json`
# — or the alarm becomes the noise one clicks away after the third time.
#
# **What the cache below hides, named honestly:** it serves documents already
# fetched from disk, so in CI class B notices *no* retroactive change to a
# document that has been fetched once. What it does notice in CI is a shift
# caused by our own code, and everything about new drafts. For the other
# question — did RIS touch something retroactively — the run has to happen
# without the cache; that is handwork and not a weekly job.
#
# **The baseline reminds us of itself.** From an age of 60 days the run
# reports a finding of class `wartung` — with the command that fixes it — and
# opens an issue for it like for any other finding. Pulling it up stays
# handwork; remembering does not.
#
# Known trap, the same one as in `uptime.yml`: GitHub switches off scheduled
# workflows in repositories without commits after 60 days and sends a mail.
# Switch it on again in the Actions tab, or commit anything.
name: Annex-Drift

on:
  schedule:
    # Monday morning, off the full hour: GitHub's cron is congested there.
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Wie viele der jüngsten Begut-Datensätze geprüft werden'
        type: string
        default: '400'

permissions:
  contents: read
  issues: write

concurrency:
  group: annex-drift
  cancel-in-progress: false

env:
  LABEL: annex-drift
  LIMIT: ${{ inputs.limit || '400' }}

jobs:
  drift:
    runs-on: ubuntu-latest
    # The FIRST run has no cache and fetches both paths one after the other:
    # some 3.300 RIS requests for the Paragraph check plus 240 annexes, all
    # sequential — a good 35 minutes. After that the cache is there and only
    # the new drafts are left, so minutes. The limit is sized for the cold
    # case, not for the normal one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The harness has a disk cache of its own (`lib/harnessCache.ts`) that
      # stores every RIS request. Carrying it across the weeks is not only
      # faster but more polite: an annex published as a NOR never changes, so
      # each week only what is newly added is fetched — and that is exactly
      # what this alarm is meant to check.
      #
      # **Restore and save are separate, and that is not taste.**
      # `actions/cache` saves in its post step only when the job *succeeded* —
      # but this job fails on purpose as soon as a finding stands. With the
      # combined `actions/cache@v4` the cache was therefore not saved in
      # precisely the weeks something was found, and a standing finding would
      # never have let it grow warm. On the first run of 16.09.2026 the log
      # read „Post RIS-Cache: skipped".
      #
      # The key rotates per run (an existing key would not be saved at all);
      # `restore-keys` warms from the last run.
      - name: RIS-Cache des Prüfstands laden
        uses: actions/cache/restore@v4
        with:
          path: .harness-cache
          key: harness-cache-${{ github.run_id }}
          restore-keys: harness-cache-

      - name: Tabellenpfad messen
        run: npx vite-node scripts/harness/annexPdf.ts -- --gp=XXVIII --xml --limit=$LIMIT --json=annex-xml.json

      - name: PDF-Pfad messen
        run: npx vite-node scripts/harness/annexPdf.ts -- --gp=XXVIII --limit=$LIMIT --json=annex-pdf.json

      # Saved straight after the measurements and with `always()`: what has
      # been fetched is fetched — even when the alarm reports a finding right
      # after, or a measurement broke off. A half-filled cache is better than
      # none, and `restore-keys` picks it up next time.
      - name: RIS-Cache des Prüfstands sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .harness-cache
          key: harness-cache-${{ github.run_id }}

      # The reports stay behind as an artefact even when nothing was found:
      # class B's baseline is drawn from exactly these files, and a finding
      # can only be read against the report that produced it.
      - name: Berichte aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annex-reports
          path: annex-*.json
          retention-days: 90

      - name: Klasse A und B anwenden
        id: drift
        # `shell: bash` is not cosmetics here: the default shell of a run
        # step is `bash -e {0}` WITHOUT pipefail, and then `script | tee`
        # carries tee's exit code — always 0, that is. The alarm would never
        # have fired.
        shell: bash
        run: npx vite-node scripts/ci/annexDrift.ts -- --grundlinie=tests/fixtures/annex-baseline.json annex-xml.json annex-pdf.json | tee drift.md

      - name: Issue öffnen oder schließen
        # `always()`, because the step before ends with 1 on a finding — and
        # that is exactly when there is something to do here. A run that could
        # not measure at all (exit 2, RIS gone, timeout) lets the job go red
        # and GitHub sends the mail for a failed run: „konnte nicht prüfen"
        # and „hat etwas gefunden" are different states, and at one run a week
        # the first one may be loud too.
        if: always() && steps.drift.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          # Exit 1 writes `count`, exit 2 (report unreadable) does not. By
          # `outcome` alone the two cannot be told apart — a failed run would
          # otherwise get an issue with an empty title.
          FOUND: ${{ steps.drift.outputs.count != '' }}
          CLEAN: ${{ steps.drift.outcome == 'success' }}
          SUMMARY: ${{ steps.drift.outputs.summary }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --force \
            --color D93F0B --description "Vom Annex-Drift-Workflow geöffnet und geschlossen" >/dev/null
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open \
                   --json number --jq '.[0].number // empty')
          if [ "$FOUND" = "true" ]; then
            if [ -z "$open" ]; then
              {
                echo "@$OWNER — die wöchentliche Messung der Beilage hat am $now etwas gefunden."
                echo
                echo "**Lauf:** $RUN_URL (die Berichte hängen als Artefakt \`annex-reports\` daran)"
                echo
                cat drift.md
                echo
                echo "---"
                echo "Was die Klassen bedeuten, steht in \`scripts/lib/annexReport.ts\`; die Engine selbst in \`docs/architecture.md\` §12.13."
                echo "Nachmessen lässt sich das lokal offline: \`pnpm harness:annex --xml\` und ohne \`--xml\` (braucht \`.harness-cache\`)."
              } > body.md
              gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
                --title "Beilage: $SUMMARY" --body-file body.md
            else
              echo "Befund steht weiter an, Issue #$open ist offen"
            fi
          elif [ "$CLEAN" = "true" ] && [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" \
              --comment "Ohne Befund am $now. Lauf: $RUN_URL"
          elif [ "$CLEAN" = "true" ]; then
            echo "ohne Befund"
          else
            # Only the run that could not measure at all reaches here. The
            # job is red, GitHub sends the mail for it, and an open finding
            # stays open — a failed measurement is no all-clear.
            echo "Lauf gescheitert, ohne Urteil — ein offener Befund bleibt offen"
          fi
