# Wöchentlicher Drift-Alarm für die Textgegenüberstellung
# (docs/architecture.md §12.13).
#
# Was hier NICHT geprüft wird: ob wir die Engine kaputt gemacht haben. Das
# fangen `ci.yml` mit 1.000+ Tests, `tests/annexGolden.test.ts`, das zwei
# echte Beilagen mit ihren Zahlen einfriert, und seit 22.09.2026
# `tests/annexGateGolden.test.ts`, das fünf echte Läufe des Tors mit ihren
# Urteilen einfriert — zwei davon scheitern gemessen an der Engine-Arbeit vom
# 19.09., die hier zwölf Befunde wert war. Geprüft wird die andere Richtung:
# ein Ressort setzt seine Beilage anders als bisher, und die Seite zeigt
# lautlos eine Gegenüberstellung, die niemand als falsch erkennt. Das ist die
# Betriebslast, an der der Vorgänger gestorben ist, also läuft der Alarm auf
# GitHubs Runnern und nicht als Dienst auf dem 1-GB-VPS.
#
# **Klasse A** (`scripts/annex-report.ts`) sind die Befunde, die ohne
# Grundlinie feststehen: die vier Zusicherungen des Tors, die Summe der
# Einbehaltungsgründe, nicht gelesene Seiten, und ob der Lauf überhaupt etwas
# gemessen hat. Kennzahlen, die mit der Zusammensetzung des Korpus wandern,
# stehen bewusst NICHT darin — der Prüfstand läuft über die 400 jüngsten
# Begut-Datensätze, also über ein wanderndes Fenster, und eine Regel darüber
# meldete jede Woche eine Änderung.
#
# **Klasse B** vergleicht jeden Entwurf, den wir schon einmal gemessen haben,
# gegen `tests/fixtures/annex-baseline.json`. Eine NOR-veröffentlichte Beilage
# ändert sich nie und das Tor hält gegen das RIS zum Beginn der
# Begutachtungsfrist — gegen ein festes Datum. Derselbe Entwurf muss sich also
# morgen genauso messen wie heute, und deshalb ist die Regel Gleichheit und
# kein Toleranzband. Neue Entwürfe zählen nicht mit (für sie gilt Klasse A),
# und dass einer aus dem Fenster der 400 jüngsten rutscht, ist der Normalfall
# und keine Meldung.
#
# **Wenn der Alarm anschlägt, weil du die Engine absichtlich verbessert hast:**
# bei Klasse A kann er das nicht — da gibt es keine Grundlinie. Bei Klasse B
# schon, und dann gilt die Regel ohne Ausnahme: die Grundlinie wird im SELBEN
# Commit nachgezogen wie die Änderung —
# `npx vite-node scripts/annex-drift.ts -- --grundlinie-schreiben=tests/fixtures/annex-baseline.json annex-xml.json annex-pdf.json`
# — sonst wird der Alarm zu dem Rauschen, das man nach dem dritten Mal
# wegklickt.
#
# **Was der Cache unten verdeckt, ehrlich benannt:** er liefert bereits
# geholte Dokumente von der Platte, also bemerkt Klasse B im CI *keine*
# nachträgliche Änderung an einem Dokument, das schon einmal geholt wurde.
# Was sie im CI bemerkt, ist eine Verschiebung durch unseren eigenen Code und
# alles an neuen Entwürfen. Für die andere Frage — hat das RIS rückwirkend
# etwas angefasst — muss der Lauf ohne Cache erfolgen; das ist eine Handarbeit
# und kein Wochenjob.
#
# **Die Grundlinie mahnt sich selbst an.** Ab 60 Tagen Alter meldet der Lauf
# einen Befund der Klasse `wartung` — mit dem Befehl, der es behebt — und
# öffnet dafür ein Issue wie für jeden anderen Befund. Das Nachziehen bleibt
# Handarbeit, das Erinnern nicht.
#
# Bekannte Falle, dieselbe wie bei `uptime.yml`: GitHub schaltet geplante
# Workflows in Repositories ohne Commits nach 60 Tagen ab und schickt eine
# Mail. Im Actions-Tab wieder einschalten oder irgendetwas committen.
name: Annex-Drift

on:
  schedule:
    # Montag früh, abseits der vollen Stunde: GitHubs Cron ist dort verstopft.
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Wie viele der jüngsten Begut-Datensätze geprüft werden'
        type: string
        default: '400'

permissions:
  contents: read
  issues: write

concurrency:
  group: annex-drift
  cancel-in-progress: false

env:
  LABEL: annex-drift
  LIMIT: ${{ inputs.limit || '400' }}

jobs:
  drift:
    runs-on: ubuntu-latest
    # Der ERSTE Lauf hat keinen Cache und holt beide Pfade nacheinander: rund
    # 3.300 RIS-Abrufe für die Paragraphenprüfung plus 240 Beilagen, alles
    # sequenziell — das sind gut und gern 35 Minuten. Danach liegt der Cache
    # und es bleiben die neuen Entwürfe, also Minuten. Die Grenze ist für den
    # kalten Fall bemessen, nicht für den Normalfall.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Der Prüfstand hat einen eigenen Plattencache (`harness-cache.ts`), der
      # jeden RIS-Abruf ablegt. Ihn über die Wochen mitzunehmen ist nicht nur
      # schneller, sondern höflicher: eine NOR-veröffentlichte Beilage ändert
      # sich nie, also wird jede Woche nur das geholt, was neu dazugekommen
      # ist — und das ist genau das, was dieser Alarm prüfen soll.
      #
      # **Laden und Sichern sind getrennt, und das ist nicht Geschmack.**
      # `actions/cache` sichert in seinem Post-Schritt nur, wenn der Job
      # *erfolgreich* war — dieser Job scheitert aber absichtlich, sobald ein
      # Befund dasteht. Mit dem kombinierten `actions/cache@v4` wurde der
      # Cache also genau in den Wochen nicht gesichert, in denen etwas
      # gefunden wurde, und ein stehender Befund hätte ihn nie warm werden
      # lassen. Beim ersten Lauf am 16.09.2026 stand „Post RIS-Cache:
      # skipped" im Protokoll.
      #
      # Der Schlüssel rotiert je Lauf (ein bestehender Schlüssel würde gar
      # nicht erst gesichert); `restore-keys` wärmt aus dem letzten Lauf.
      - name: RIS-Cache des Prüfstands laden
        uses: actions/cache/restore@v4
        with:
          path: .harness-cache
          key: harness-cache-${{ github.run_id }}
          restore-keys: harness-cache-

      - name: Tabellenpfad messen
        run: npx vite-node scripts/annex-pdf-verify.ts -- --gp=XXVIII --xml --limit=$LIMIT --json=annex-xml.json

      - name: PDF-Pfad messen
        run: npx vite-node scripts/annex-pdf-verify.ts -- --gp=XXVIII --limit=$LIMIT --json=annex-pdf.json

      # Gesichert wird direkt nach den Messungen und mit `always()`: was geholt
      # wurde, ist dann geholt — auch wenn der Alarm gleich einen Befund
      # meldet oder eine Messung abgebrochen ist. Ein halb gefüllter Cache ist
      # besser als keiner, `restore-keys` nimmt ihn beim nächsten Mal mit.
      - name: RIS-Cache des Prüfstands sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .harness-cache
          key: harness-cache-${{ github.run_id }}

      # Die Berichte bleiben als Artefakt liegen, auch wenn nichts gefunden
      # wurde: die Grundlinie für Klasse B wird aus genau diesen Dateien
      # gezogen, und ein Befund lässt sich nur gegen den Bericht lesen, der
      # ihn erzeugt hat.
      - name: Berichte aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annex-reports
          path: annex-*.json
          retention-days: 90

      - name: Klasse A und B anwenden
        id: drift
        # `shell: bash` ist hier nicht Kosmetik: der Standard-Shell eines
        # run-Schritts ist `bash -e {0}` OHNE pipefail, und dann trägt
        # `skript | tee` den Exit-Code von tee — also immer 0. Der Alarm hätte
        # nie ausgelöst.
        shell: bash
        run: npx vite-node scripts/annex-drift.ts -- --grundlinie=tests/fixtures/annex-baseline.json annex-xml.json annex-pdf.json | tee drift.md

      - name: Issue öffnen oder schließen
        # `always()`, weil der Schritt davor bei einem Befund mit 1 endet —
        # genau dann ist hier etwas zu tun. Ein Lauf, der gar nicht messen
        # konnte (Exit 2, RIS weg, Timeout), lässt den Job rot werden und
        # GitHub schickt die Mail für einen fehlgeschlagenen Lauf: „konnte
        # nicht prüfen" und „hat etwas gefunden" sind verschiedene Zustände,
        # und bei einem Lauf pro Woche darf der erste auch laut sein.
        if: always() && steps.drift.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          # Exit 1 schreibt `count`, Exit 2 (Bericht unlesbar) nicht. An
          # `outcome` allein sind die beiden nicht zu unterscheiden — ein
          # gescheiterter Lauf bekäme sonst ein Issue mit leerem Titel.
          FOUND: ${{ steps.drift.outputs.count != '' }}
          CLEAN: ${{ steps.drift.outcome == 'success' }}
          SUMMARY: ${{ steps.drift.outputs.summary }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --force \
            --color D93F0B --description "Vom Annex-Drift-Workflow geöffnet und geschlossen" >/dev/null
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open \
                   --json number --jq '.[0].number // empty')
          if [ "$FOUND" = "true" ]; then
            if [ -z "$open" ]; then
              {
                echo "@$OWNER — die wöchentliche Messung der Beilage hat am $now etwas gefunden."
                echo
                echo "**Lauf:** $RUN_URL (die Berichte hängen als Artefakt \`annex-reports\` daran)"
                echo
                cat drift.md
                echo
                echo "---"
                echo "Was die Klassen bedeuten, steht in \`scripts/annex-report.ts\`; die Engine selbst in \`docs/architecture.md\` §12.13."
                echo "Nachmessen lässt sich das lokal offline: \`pnpm harness:annex --xml\` und ohne \`--xml\` (braucht \`.harness-cache\`)."
              } > body.md
              gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
                --title "Beilage: $SUMMARY" --body-file body.md
            else
              echo "Befund steht weiter an, Issue #$open ist offen"
            fi
          elif [ "$CLEAN" = "true" ] && [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" \
              --comment "Ohne Befund am $now. Lauf: $RUN_URL"
          elif [ "$CLEAN" = "true" ]; then
            echo "ohne Befund"
          else
            # Nur hierher kommt der Lauf, der gar nicht messen konnte. Der
            # Job ist rot, GitHub schickt die Mail dafür, und ein offener
            # Befund bleibt offen — eine gescheiterte Messung ist keine
            # Entwarnung.
            echo "Lauf gescheitert, ohne Urteil — ein offener Befund bleibt offen"
          fi
