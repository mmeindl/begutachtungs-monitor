# Tests and typecheck on every push and pull request.
#
# Until 2026-09-10 the only workflow in this repository probed the live site;
# nothing ran the 500-odd tests, so a red suite could reach `main` and only be
# noticed on the next local run. This is the cheap half of that gap.
#
# Five commands, and two of them exist because of holes that let bugs ship:
# `nuxt typecheck` sees the app and `shared/`, and nothing else. `scripts/`
# and `tests/` are `tsconfig.tools.json`'s (twice a shipped bug lived there),
# and `server/` is a TypeScript program of its own, `.nuxt/tsconfig.server.json`,
# which nothing ran until 12.11.2026 — a real type error in the server's
# middleware had passed every check. All three projects need
# `.nuxt/tsconfig*.json`, which `nuxt prepare` writes — `pnpm install` runs it
# as `postinstall`, so the install step is also the generate step, and every
# typecheck below must stay after it.
#
# The last is `pnpm lint`. It fails on errors only; warnings are what the
# linter is allowed to say without stopping anyone (`eslint.config.mjs`).
#
# Node 22 is what the server runs (`deploy/infrastructure.md`); pnpm 10 is
# what the lockfile (v9.0 format) was written with. Neither is pinned in
# `package.json`, so they are pinned here, and a bump belongs in both places.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before setup-node: its pnpm cache needs the store path, which only
      # exists once pnpm is installed.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (runs `nuxt prepare` via postinstall)
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: Typecheck (app, shared)
        run: pnpm typecheck

      - name: Typecheck (server)
        run: pnpm typecheck:server

      - name: Typecheck (scripts, tests)
        run: pnpm typecheck:tools

      - name: Lint
        run: pnpm lint
