# Uptime check without a monitoring account (docs/architecture.md §12.7,
# deploy/infrastructure.md): GitHub's runners probe the live site twice an
# hour. On failure the workflow opens ONE issue labelled `downtime` and
# @mentions the owner — GitHub mails that — and closes it when the site
# answers again. The job itself stays green so a night of downtime is one
# issue, not 20 failed-run e-mails.
#
# What counts as "up": HTTP 200 on the start page AND the word
# "Begutachtung" in the body. A Caddy error page or an empty shell is down.
#
# Second probe, the data canary: one detail page must still name a known
# organisation among its Stellungnahmen (8/ME XXVIII, the Österreichischer
# Rechtsanwaltskammertag). That name is in the SSR HTML only if list 142 was
# read, its columns were where the mapper expects them and the classifier
# recognised the row — the one failure this catches is the silent one, where
# every submitter degrades to "Privatperson" and the site looks healthy. An
# upstream outage does NOT trip it: the page then serves its last-good
# aggregation, name included, and labels the staleness itself.
#
# Third probe, the Länder canary (22.10.2026): /api/laender names every
# Land the monitor reads and whether its page could be read. A Land that
# cannot — its site down, or a relaunch the parser's gate refuses — opens its
# OWN issue, labelled `land-quelle`, not `downtime`: the site is up, one
# source is not, and the page already says so to its readers. Judged twice,
# 90 s apart, because a failed read is not cached and a single slow answer
# from a Land's server is not a broken parser.
#
# Known trap: GitHub disables scheduled workflows in repositories without
# commits for 60 days and sends a mail when it does. Re-enable it in the
# Actions tab, or make any commit.
name: Uptime

on:
  schedule:
    # Off the full and half hour: GitHub's cron is congested there.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Testalarm: "down" reports the site as down without probing it, so the issue + e-mail path can be tested; the next scheduled run closes the issue again'
        type: choice
        options: [none, down]
        default: none

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

env:
  SITE: https://begutachtungs-monitor.at/
  KEYWORD: Begutachtung
  CANARY_SITE: https://begutachtungs-monitor.at/entwuerfe/XXVIII/8
  CANARY_KEYWORD: Rechtsanwaltskammertag
  LABEL: downtime
  LAENDER_API: https://begutachtungs-monitor.at/api/laender
  LAND_LABEL: land-quelle

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the start page
        id: probe
        env:
          SIMULATE: ${{ inputs.simulate || 'none' }}
        run: |
          set +e
          if [ "$SIMULATE" = "down" ]; then
            echo "reason=Testalarm – manuell ausgelöst, die Seite ist erreichbar" >> "$GITHUB_OUTPUT"
            echo "::notice::simulated downtime, no probe sent"
            exit 0
          fi
          tmp=$(mktemp)
          code=$(curl -sS -L --max-time 30 --retry 2 --retry-delay 15 --retry-all-errors \
                   -o "$tmp" -w '%{http_code}' "$SITE" 2>"$tmp.err")
          rc=$?
          if [ "$rc" -ne 0 ]; then
            reason="curl failed (exit $rc): $(tr -d '\n' < "$tmp.err" | cut -c1-200)"
          elif [ "$code" != "200" ]; then
            reason="HTTP $code"
          elif ! grep -q "$KEYWORD" "$tmp"; then
            reason="HTTP 200, but the page does not contain \"$KEYWORD\""
          else
            reason=""
          fi
          # The data canary runs only when the site itself is up — a dead
          # site needs one reason, not two.
          if [ -z "$reason" ]; then
            ctmp=$(mktemp)
            ccode=$(curl -sS -L --max-time 30 --retry 2 --retry-delay 15 --retry-all-errors \
                      -o "$ctmp" -w '%{http_code}' "$CANARY_SITE" 2>"$ctmp.err")
            crc=$?
            if [ "$crc" -ne 0 ]; then
              reason="canary: curl failed (exit $crc): $(tr -d '\n' < "$ctmp.err" | cut -c1-200)"
            elif [ "$ccode" != "200" ]; then
              reason="canary: HTTP $ccode on $CANARY_SITE"
            elif ! grep -q "$CANARY_KEYWORD" "$ctmp"; then
              reason="canary: 8/ME no longer names \"$CANARY_KEYWORD\" — Stellungnahmen pipeline (list 142 columns, classifier) suspect"
            fi
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then echo "::warning::DOWN — $reason"; else echo "up (HTTP 200, keyword present, canary present)"; fi

      - name: Open or close the downtime issue
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.probe.outputs.reason }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "Opened and closed by the Uptime workflow" >/dev/null
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open \
                   --json number --jq '.[0].number // empty')
          if [ -n "$REASON" ]; then
            if [ -z "$open" ]; then
              body=$(printf '%s\n\n%s\n%s\n\n%s' \
                "@$OWNER — the start page failed the uptime probe at $now." \
                "**Reason:** $REASON" \
                "**Probe:** $RUN_URL" \
                "The workflow re-checks twice an hour and closes this issue when the site answers again. Runbook: \`deploy/infrastructure.md\` (service status, app logs, redeploy).")
              gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
                --title "Downtime: begutachtungs-monitor.at — $REASON" \
                --body "$body"
            else
              echo "still down, issue #$open already open"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" \
              --comment "Back up at $now (HTTP 200, keyword and canary present). Probe: $RUN_URL"
          fi

      - name: Probe the Länder sources
        id: laender
        if: steps.probe.outputs.reason == ''
        run: |
          set +e
          unreadable() {
            curl -sS -L --max-time 60 --retry 2 --retry-delay 15 --retry-all-errors "$LAENDER_API" \
              | jq -r '[.sources[] | select(.state != "ok") | .land] | join(",")' 2>/dev/null
          }
          first=$(unreadable); rc=$?
          if [ "$rc" -ne 0 ]; then first="api"; fi
          if [ -n "$first" ]; then
            sleep 90
            second=$(unreadable); rc=$?
            if [ "$rc" -ne 0 ]; then second="api"; fi
          else
            second=""
          fi
          echo "lands=$second" >> "$GITHUB_OUTPUT"
          if [ -n "$second" ]; then echo "::warning::Länder nicht lesbar: $second"; else echo "alle Länder lesbar"; fi

      - name: Open or close the Länder issue
        if: steps.probe.outputs.reason == ''
        env:
          GH_TOKEN: ${{ github.token }}
          LANDS: ${{ steps.laender.outputs.lands }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          gh label create "$LAND_LABEL" --repo "$GITHUB_REPOSITORY" --force \
            --color D93F0B --description "A Land's source cannot be read; opened and closed by the Uptime workflow" >/dev/null
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LAND_LABEL" --state open \
                   --json number --jq '.[0].number // empty')
          if [ -n "$LANDS" ]; then
            if [ -z "$open" ]; then
              body=$(printf '%s\n\n%s\n%s\n\n%s' \
                "@$OWNER — a Land's list could not be read at $now (twice, 90 s apart)." \
                "**Länder:** $LANDS (\`api\` = /api/laender itself did not answer)" \
                "**Probe:** $RUN_URL" \
                "The site shows these Länder as „gerade nicht abrufbar“ meanwhile. Check the Land's page against its parser and gate in \`server/utils/laender/\` (a relaunch, or a maintenance page). Closes itself when every Land reads again.")
              gh issue create --repo "$GITHUB_REPOSITORY" --label "$LAND_LABEL" \
                --title "Land-Quelle nicht lesbar: $LANDS" --body "$body"
            else
              echo "still unreadable, issue #$open already open"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" \
              --comment "Every Land reads again at $now. Probe: $RUN_URL"
          fi
